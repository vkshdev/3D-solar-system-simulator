<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <radialGradient id="space-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0c1222"/>
      <stop offset="100%" stop-color="#02050c"/>
    </radialGradient>
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#ffdd80"/>
      <stop offset="70%" stop-color="#ff8800"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="ring-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.7)"/>
      <stop offset="50%" stop-color="rgba(160, 190, 255, 0.4)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.1)"/>
    </linearGradient>
  </defs>

  <!-- Deep space circular background -->
  <circle cx="64" cy="64" r="62" fill="url(#space-bg)" stroke="rgba(255, 255, 255, 0.16)" stroke-width="2"/>

  <!-- Orbital Rings -->
  <ellipse cx="64" cy="64" rx="46" ry="18" fill="none" stroke="url(#ring-glow)" stroke-width="1.6" transform="rotate(-28 64 64)"/>
  <ellipse cx="64" cy="64" rx="34" ry="13" fill="none" stroke="rgba(255, 255, 255, 0.28)" stroke-width="1.2" stroke-dasharray="3,3" transform="rotate(-28 64 64)"/>
  <ellipse cx="64" cy="64" rx="22" ry="8" fill="none" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1.0" transform="rotate(-28 64 64)"/>

  <!-- Central Star / Galactic Core -->
  <circle cx="64" cy="64" r="16" fill="url(#core-glow)"/>
  <circle cx="64" cy="64" r="7" fill="#ffffff"/>

  <!-- Planets along Orbits -->
  <circle cx="94" cy="48" r="4.2" fill="#4d94ff" stroke="#ffffff" stroke-width="0.8"/>
  <circle cx="36" cy="74" r="3.2" fill="#e07a5f"/>
  <circle cx="82" cy="72" r="2.4" fill="#81b29a"/>

  <!-- Background Stars -->
  <circle cx="28" cy="32" r="1.0" fill="#ffffff" opacity="0.8"/>
  <circle cx="102" cy="26" r="1.2" fill="#ffffff" opacity="0.9"/>
  <circle cx="38" cy="100" r="0.8" fill="#ffffff" opacity="0.6"/>
  <circle cx="98" cy="98" r="1.1" fill="#ffffff" opacity="0.75"/>
  <circle cx="18" cy="68" r="0.9" fill="#ffffff" opacity="0.5"/>
</svg>
